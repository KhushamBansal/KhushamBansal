<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#3F97F7;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
        </linearGradient>
        <style>
            @keyframes float {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-20px); }
                100% { transform: translateY(0px); }
            }
            .floating {
                animation: float 6s ease-in-out infinite;
            }
        </style>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#grad1)"/>
    
    <!-- Grid Pattern -->
    <path d="M0 50 L1200 50 M0 100 L1200 100 M0 150 L1200 150 M0 200 L1200 200 M0 250 L1200 250"
          stroke="white" stroke-width="0.5" stroke-opacity="0.1"/>
    
    <!-- Main Text -->
    <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" 
          fill="white" font-family="Arial" font-size="48" font-weight="bold" class="floating">
        Khusham Bansal | Software Engineer
    </text>
    
    <!-- Decorative Elements -->
    <circle cx="200" cy="150" r="30" fill="white" fill-opacity="0.1"/>
    <circle cx="1000" cy="150" r="50" fill="white" fill-opacity="0.1"/>
    
    <!-- Code Symbols -->
    <text x="100" y="280" fill="white" font-family="monospace" font-size="24" fill-opacity="0.5">&lt;/&gt;</text>
    <text x="1100" y="50" fill="white" font-family="monospace" font-size="24" fill-opacity="0.5">{}</text>
</svg> 